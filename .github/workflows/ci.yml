
name: Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Run unit and integration tests
      - name: Unit and HTTP integration tests
        run: |
          python -m unittest discover -s tests -v

      # 4. Install Bandit
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'bandit==1.8.6'

      # 5. Static Application Security Testing
      - name: SAST (Bandit)
        id: bandit
        continue-on-error: true
        run: |
          mkdir -p reports

          bandit -r src \
            -f json \
            -o reports/bandit.json

      # 6. Cache Dependency-Check database
      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-12-2-2-v1

      # 7. Verify NVD API Key
      - name: Verify NVD API Key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY is EMPTY or unavailable"
            exit 1
          fi

          echo "NVD_API_KEY is available."

      # 8. Check Dependency-Check version
      - name: Check Dependency-Check version
        run: |
          docker run --rm \
            owasp/dependency-check:12.2.2 \
            --version

      # 9. Software Composition Analysis
      - name: SCA (OWASP Dependency-Check)
        id: dependency_check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports
          mkdir -p "${{ runner.temp }}/dependency-check-data"

          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY is missing"
            exit 1
          fi

          echo "Starting OWASP Dependency-Check 12.2.2"

          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/reports:/report" \
            -v "${{ runner.temp }}/dependency-check-data:/usr/share/dependency-check/data" \
            owasp/dependency-check:12.2.2 \
            --nvdApiKey "$NVD_API_KEY" \
            --scan /src \
            --out /report \
            --format HTML \
            --format JSON \
            --project Work1 \
            --failOnCVSS 7

      # 10. Upload security reports
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn

      # 11. Enforce security checks
      - name: Check security scan results
        if: always()
        env:
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          SCA_OUTCOME: ${{ steps.dependency_check.outcome }}
        run: |
          if [ "$BANDIT_OUTCOME" != "success" ]; then
            echo "::error::Bandit scan failed or found issues"
            exit 1
          fi

          if [ "$SCA_OUTCOME" != "success" ]; then
            echo "::error::Dependency-Check failed or found vulnerabilities above the threshold"
            exit 1
          fi

          echo "All security checks passed."

